<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNAssistant — просмотр рабочего UI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #e9ece8; color: #27372e; font: 12px/1.4 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; min-height: 40px; padding: 0 14px; }
    header strong { font-weight: 600; }
    header span { color: #5e6a61; }
    header a { margin-left: auto; color: #3d725a; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: white; }
  </style>
</head>
<body>
  <header><strong>Рабочий UI</strong><span>Данные примера для сравнения; действия не сохраняются</span><a href="/" target="_blank" rel="noopener">Открыть демо ↗</a></header>
  <iframe id="product" src="/web/" title="Рабочий интерфейс RNAssistant"></iframe>
  <script src="product-preview.js"></script>
</body>
</html>
