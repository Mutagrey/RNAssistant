<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNAssistant — просмотр рабочего UI</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; background: #e9ece8; color: #27372e; font: 12px/1.4 system-ui, sans-serif; }
    header { display: flex; align-items: center; gap: 16px; min-height: 40px; padding: 0 14px; }
    header strong { font-weight: 600; }
    header span { color: #5e6a61; }
    header select { margin-left: auto; font: inherit; padding: 4px 8px; }
    header a { color: #3d725a; text-decoration: none; }
    header a:hover { text-decoration: underline; }
    iframe { flex: 1; width: 100%; min-height: 0; border: 0; background: white; }
  </style>
</head>
<body>
  <header><strong>Рабочий UI</strong><span>Реальные экраны и обработчики с временным mock bridge</span><select id="scenario" aria-label="Состояние примера"><option value="ready">Заполнено</option><option value="empty">Пусто</option><option value="error">Ошибка чтения</option></select><a href="/" target="_blank" rel="noopener">Открыть демо ↗</a></header>
  <iframe id="product" src="/preview/web/?scenario=ready" title="Рабочий интерфейс RNAssistant"></iframe>
  <script>document.getElementById("scenario").addEventListener("change", function (event) { document.getElementById("product").src = "/preview/web/?scenario=" + encodeURIComponent(event.target.value); });</script>
</body>
</html>
