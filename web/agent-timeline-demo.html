<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RNAssistant Agent Timeline Demo</title>
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/app-chat.css">
  <link rel="stylesheet" href="css/app-markdown.css">
  <link rel="stylesheet" href="css/app-agent.css">
  <link rel="stylesheet" href="css/app-agent-data.css">
  <style>
    body {
      margin: 0;
      background: #f3f6fa;
      color: var(--text);
      font: 13px/1.45 "Segoe UI", system-ui, sans-serif;
    }

    .demo-shell {
      max-width: 920px;
      margin: 0 auto;
      padding: 28px 20px 40px;
    }

    .demo-head {
      margin-bottom: 18px;
    }

    .demo-title {
      margin: 0;
      font-size: 24px;
      font-weight: 700;
    }

    .demo-text {
      margin: 8px 0 0;
      color: #667085;
    }

    .demo-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 18px 0 14px;
    }

    .demo-toolbar button {
      min-height: 30px;
      padding: 0 12px;
      border: 1px solid #d7dee8;
      border-radius: 999px;
      background: #fff;
      color: #344054;
      font: inherit;
      cursor: pointer;
    }

    .demo-toolbar button.is-active {
      border-color: #98b7e3;
      background: #eef5ff;
      color: #174ea6;
    }

    .demo-stage {
      padding: 18px 18px 14px;
      border: 1px solid #dfe6ee;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
    }

    .demo-stage-note {
      margin: 0 0 12px;
      color: #667085;
      font-size: 12px;
    }

    .demo-stage .messages {
      height: auto;
      overflow: visible;
      padding: 0;
    }

    .demo-stage .message-footer {
      opacity: 1;
      transform: none;
    }

    .demo-stage .message-action {
      width: auto;
      min-width: 0;
      padding: 0 8px;
      border-radius: 999px;
      background: rgba(226, 231, 239, 0.62);
      font-size: 11px;
    }

    .demo-stage .message-action svg {
      display: none;
    }

    .demo-stage .message.assistant .markdown {
      padding-left: 0;
    }

    .demo-stage .message.user .markdown {
      max-width: 86%;
    }

    .demo-chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: #f8fafc;
      color: #667085;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="demo-shell">
    <div class="demo-head">
      <h1 class="demo-title">Compact Agent Timeline Demo</h1>
      <p class="demo-text">Демо показывает, как шаги агента идут отдельными сообщениями в ленте, а финальный ответ живет ниже отдельным assistant-message.</p>
    </div>

    <div class="demo-toolbar" role="tablist" aria-label="Сценарии таймлайна">
      <button type="button" class="is-active" data-scene="history">История</button>
      <button type="button" data-scene="live">Live + stream</button>
      <button type="button" data-scene="waiting">Waiting confirm</button>
      <button type="button" data-scene="retry">Failed + retry</button>
    </div>

    <div class="demo-stage">
      <p class="demo-stage-note" id="demoStageNote"></p>
      <div class="messages" id="demoMessages"></div>
      <div class="demo-chip">RNAssistant preview · neutral timeline · footer aligned to message edge</div>
    </div>
  </div>

  <template id="scene-history">
    <article class="message user">
      <div class="markdown">
        <p>Собери краткий отчет по продажам и покажи, что делает агент по шагам.</p>
      </div>
    </article>

    <article class="message assistant is-activity-message">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-completed">
          <details class="agent-activity-toggle">
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Собираю план ответа</span>
              <span class="agent-activity-comment"></span>
              <div class="agent-activity-meta">19:42 · Готово</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-activity-children">
                <div class="agent-activity nested status-completed">
                  <div class="agent-activity-row">
                    <span class="agent-activity-mark" aria-hidden="true"></span>
                    <span class="agent-activity-name">Проверить структуру таблицы</span>
                    <span class="agent-activity-comment">excel.read_range</span>
                    <div class="agent-activity-meta">В плане</div>
                    <span class="agent-activity-caret is-hidden" aria-hidden="true">›</span>
                  </div>
                </div>
                <div class="agent-activity nested status-completed">
                  <div class="agent-activity-row">
                    <span class="agent-activity-mark" aria-hidden="true"></span>
                    <span class="agent-activity-name">Подготовить короткий summary</span>
                    <span class="agent-activity-comment"></span>
                    <div class="agent-activity-meta">В плане</div>
                    <span class="agent-activity-caret is-hidden" aria-hidden="true">›</span>
                  </div>
                </div>
              </div>
              <div class="agent-activity-result">План собран и готов к выполнению.</div>
            </div>
          </details>
        </div>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">124 токена</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>

    <article class="message assistant is-activity-message">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-completed">
          <details class="agent-activity-toggle">
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Читаю диапазон с продажами</span>
              <span class="agent-activity-comment">excel.read_range</span>
              <div class="agent-activity-meta">19:42 · Готово</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-activity-result">Прочитано 24 строки, нашел пики в марте и июне.</div>
            </div>
          </details>
        </div>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">0.6 c</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>

    <article class="message assistant is-activity-message">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-completed">
          <details class="agent-activity-toggle">
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Строю краткий summary</span>
              <span class="agent-activity-comment"></span>
              <div class="agent-activity-meta">19:42 · Готово</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-activity-result">Все данные на месте, можно формировать итоговое сообщение.</div>
            </div>
          </details>
        </div>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">76 токенов</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>

    <article class="message assistant">
      <div class="markdown">
        <p>Продажи росли неравномерно: максимум пришелся на март и июнь, затем пошла стабилизация. Если хотите, следующим сообщением агент может сразу построить график и добавить выводы в таблицу.</p>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">201 токен</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>
  </template>

  <template id="scene-live">
    <article class="message user">
      <div class="markdown">
        <p>Построй summary и не прячь live progress, пока идет финальный ответ.</p>
      </div>
    </article>

    <article class="message assistant is-activity-message pending">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-completed">
          <div class="agent-activity-row">
            <span class="agent-activity-mark" aria-hidden="true"></span>
            <span class="agent-activity-name">Собираю план ответа</span>
              <span class="agent-activity-comment"></span>
            <div class="agent-activity-meta">Готово</div>
            <span class="agent-activity-caret is-hidden" aria-hidden="true">›</span>
          </div>
        </div>
      </div>
    </article>

    <article class="message assistant is-activity-message pending is-current-activity">
      <div class="agent-activity-wrap">
        <div class="agent-activity current status-running">
          <details class="agent-activity-toggle" open>
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Собираю итоговый summary по данным</span>
              <span class="agent-activity-comment">summarize_range</span>
              <div class="agent-activity-meta">Выполняю</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-activity-children">
                <div class="agent-activity nested status-completed">
                  <div class="agent-activity-row">
                    <span class="agent-activity-mark" aria-hidden="true"></span>
                    <span class="agent-activity-name">Найден рост по кварталам</span>
                    <span class="agent-activity-comment"></span>
                    <div class="agent-activity-meta">Готово</div>
                    <span class="agent-activity-caret is-hidden" aria-hidden="true">›</span>
                  </div>
                </div>
              </div>
              <div class="agent-activity-result">Текущий шаг виден, даже когда модель уже начала стримить финальный ответ ниже.</div>
            </div>
          </details>
        </div>
      </div>
    </article>

    <article class="message assistant pending streaming-message">
      <div class="markdown">
        <p>По текущим данным видно устойчивое ускорение продаж во втором квартале, при этом после июня темп роста начал замедляться<span class="streaming-cursor" aria-hidden="true"></span></p>
      </div>
    </article>
  </template>

  <template id="scene-waiting">
    <article class="message user">
      <div class="markdown">
        <p>Если tool требует подтверждения, покажи это внутри шага, а не отдельным странным блоком сверху.</p>
      </div>
    </article>

    <article class="message assistant is-activity-message is-current-activity">
      <div class="agent-activity-wrap">
        <div class="agent-activity current status-waiting">
          <details class="agent-activity-toggle" open>
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Готовлю изменение таблицы продаж</span>
              <span class="agent-activity-comment">excel.write_range</span>
              <div class="agent-activity-meta">Нужно подтверждение</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-confirm-panel">
                <div class="agent-confirm-reason">Инструмент собирается перезаписать диапазон B2:E12. Пользователь подтверждает действие прямо внутри карточки шага.</div>
                <div class="agent-inline-actions">
                  <button class="agent-action-button primary" type="button">Подтвердить</button>
                  <button class="agent-action-button secondary" type="button">Отменить</button>
                </div>
              </div>
              <div class="agent-activity-result">Карточка остается на месте и не ломает порядок ленты.</div>
            </div>
          </details>
        </div>
      </div>
    </article>
  </template>

  <template id="scene-retry">
    <article class="message user">
      <div class="markdown">
        <p>Не скрывай неудавшийся шаг, если следом пошел retry.</p>
      </div>
    </article>

    <article class="message assistant is-activity-message">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-failed">
          <details class="agent-activity-toggle" open>
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Читаю таблицу продаж</span>
              <span class="agent-activity-comment">excel.read_range</span>
              <div class="agent-activity-meta">Ошибка</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-error-panel">
                <div class="agent-error-reason">Источник данных был временно недоступен. Этот failed step остается в истории как отдельная карточка.</div>
                <div class="agent-error-meta">Инструмент: excel.read_range</div>
              </div>
            </div>
          </details>
        </div>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">retry path</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>

    <article class="message assistant is-activity-message">
      <div class="agent-activity-wrap">
        <div class="agent-activity status-completed">
          <details class="agent-activity-toggle">
            <summary class="agent-activity-row">
              <span class="agent-activity-mark" aria-hidden="true"></span>
              <span class="agent-activity-name">Повторяю чтение диапазона</span>
              <span class="agent-activity-comment"></span>
              <div class="agent-activity-meta">Готово</div>
              <span class="agent-activity-caret" aria-hidden="true">›</span>
            </summary>
            <div class="agent-activity-detail-body">
              <div class="agent-activity-result">Повтор успешен, карточка retry идет следующей в ленте и не заменяет исходную ошибку.</div>
            </div>
          </details>
        </div>
      </div>
      <div class="message-footer">
        <div class="message-footer-meta"><span class="message-usage">retry · ok</span></div>
        <div class="message-actions">
          <button class="message-action" type="button">Ветка</button>
          <button class="message-action" type="button">Копия</button>
          <button class="message-action" type="button">Удалить</button>
        </div>
      </div>
    </article>

    <article class="message assistant">
      <div class="markdown">
        <p>После повторной попытки диапазон успешно прочитан, поэтому итоговый ответ строится уже на актуальных данных.</p>
      </div>
    </article>
  </template>

  <script>
    (function () {
      var notes = {
        history: "Исторический сценарий: шаги агента идут последовательно, а финальный ответ остается отдельным сообщением.",
        live: "Live сценарий: текущий шаг остается видимым, пока ниже уже стримится финальный ответ.",
        waiting: "Waiting-confirmation: подтверждение живет внутри самой карточки шага.",
        retry: "Failed + retry: исходная ошибка остается в ленте, а успешный retry идет следующим сообщением."
      };

      function renderScene(scene) {
        var template = document.getElementById("scene-" + scene);
        var messages = document.getElementById("demoMessages");
        var note = document.getElementById("demoStageNote");
        if (!template || !messages || !note) {
          return;
        }

        messages.innerHTML = template.innerHTML;
        Array.prototype.forEach.call(messages.querySelectorAll(".agent-activity-row"), function (row) {
          var comment = row.querySelector(".agent-activity-comment");
          if (!comment || !comment.textContent.trim()) {
            row.classList.add("has-no-comment");
            if (comment) {
              comment.classList.add("is-empty");
            }
          } else {
            row.classList.add("has-comment");
          }
        });
        note.textContent = notes[scene] || "";
        Array.prototype.forEach.call(document.querySelectorAll(".demo-toolbar button"), function (button) {
          button.classList.toggle("is-active", button.getAttribute("data-scene") === scene);
        });
      }

      Array.prototype.forEach.call(document.querySelectorAll(".demo-toolbar button"), function (button) {
        button.addEventListener("click", function () {
          renderScene(button.getAttribute("data-scene") || "history");
        });
      });

      renderScene("history");
    }());
  </script>
</body>
</html>
